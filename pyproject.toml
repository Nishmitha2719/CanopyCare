[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopycare"
version = "0.1.0"
description = "Spatially validated, explainable forest-loss risk research pipeline"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "joblib>=1.3,<2", "pyproj>=3.7,<4", "earthengine-api>=1.5,<2"]

[project.optional-dependencies]
collection = ["geopandas==1.1.1", "rasterio==1.4.3", "matplotlib==3.10.3", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5", "requests==2.34.2", "pyarrow==25.0.1"]
geo = ["earthengine-api>=1.0,<2", "geemap>=0.35,<1", "geopandas>=1.0,<2", "rasterio>=1.3,<2"]
boost = ["xgboost>=2.0,<4", "shap>=0.46,<1"]
graph = ["torch>=2.2,<3", "torch-geometric>=2.5,<3", "captum>=0.7,<1"]
dashboard = ["streamlit>=1.50,<2", "plotly>=5.20,<7", "folium>=0.16,<1"]

[project.scripts]
canopycare = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
